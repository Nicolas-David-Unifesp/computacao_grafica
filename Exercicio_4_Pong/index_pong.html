<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pong Ping</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        #placar {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            min-width: 160px;
        }

        #canvas_pong {
            display: block;
            border: 2px solid white;
            background: #1a1a1a;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="placar">0 : 0</div>
        <canvas id="canvas_pong" width="600" height="600"></canvas>
    </div>

    <script src="m3.js"></script>
    <script src="main_pong.js"></script>
</body>
</html>
